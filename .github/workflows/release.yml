name: Publish Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installers/*.exe
