name: Android APK preview
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build:web
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Rename APK for delivery
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ConvertHub.apk
      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: ConvertHub-Android-APK
          path: ConvertHub.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ConvertHub.apk
          name: ConvertHub ${{ github.ref_name }}
          body: |
            ConvertHub Android test APK.
            By Binary Studios
            This is a debug-signed test build, not a production Play Store release.
